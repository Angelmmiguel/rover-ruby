name: Build Ruby Image
run-name: Build ruby image ${{ github.event.inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., 3.4, latest)'
        type: string
        required: true
        default: 'latest'
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        required: false
        default: './images/ruby34/Dockerfile'
      platforms:
        description: 'Target platforms'
        type: string
        required: true
        default: 'linux/amd64,linux/arm64'
  workflow_call:
    inputs:
      tag:
        description: 'Image tag (e.g., 3.4, latest)'
        type: string
        required: true
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        required: true
      platforms:
        description: 'Target platforms'
        type: string
        required: true
        default: 'linux/amd64,linux/arm64'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Echo inputs
        run: |
          echo "Tag: $TAG"
          echo "Platforms: $PLATFORMS"
          echo "Dockerfile: $DOCKERFILE"
        env:
          TAG: ${{ inputs.tag }}
          PLATFORMS: ${{ inputs.platforms }}
          DOCKERFILE: ${{ inputs.dockerfile }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ruby
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify on Success
        if: success()
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          IMAGE_URL: 'ghcr.io/${{ github.repository }}/ruby:${{ inputs.tag }}'
        run: |
          echo "✅ Successfully built and pushed Docker image"
          echo "Image: ${IMAGE_URL}"
          echo "Platforms: ${{ inputs.platforms }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Failed to build or push Docker image"
          echo "Please check the workflow logs for details"